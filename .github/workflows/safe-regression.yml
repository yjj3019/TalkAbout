{
  "name": "Safe regression",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main",
        "feat/scoped-session-continuity"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "safe-regression-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "safe-regression": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Install tested application and test dependencies",
          "run": "python -m pip install -c .github/ci-constraints.txt -e \".[test]\""
        },
        {
          "name": "Run guarded Python and synthetic UI contracts",
          "run": "python -B tools/run_safe_regression.py"
        }
      ]
    }
  }
}
