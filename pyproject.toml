[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talkabout"
version = "0.1.0"
description = "Private text-only external-agent collaboration prototype"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
talkabout = "talkabout.cli:main"

[tool.setuptools.packages.find]
include = ["talkabout*"]

[tool.setuptools.package-data]
talkabout = ["schema.sql", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
