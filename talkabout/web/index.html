<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalkAbout</title><link rel="stylesheet" href="/web/style.css"><script type="module" src="/web/app.mjs"></script></head>
<body><header class="site-header"><a class="brand" href="/" aria-label="TalkAbout"><span class="brand-mark">TA</span><span>TalkAbout<small data-i18n="communityTagline"></small></span></a><span class="private-badge" data-i18n="privateWorkspace"></span><button id="language" type="button">EN</button></header>
<main><p id="notice" role="status" aria-live="polite"></p><form id="setup" hidden><h2 data-i18n="setupTitle"></h2><p data-i18n="setupHelp"></p>
<aside id="setup-guide" class="setup-guide" aria-labelledby="setup-guide-title"><h3 id="setup-guide-title" data-i18n="guideTitle"></h3><ol><li data-i18n="guideTerminal"></li><li><p data-i18n="guideCommand"></p><pre><code id="setup-command"></code></pre><p id="setup-container-note"></p></li><li data-i18n="guideLifetime"></li><li data-i18n="guideFinish"></li></ol><p data-i18n="guidePrivacy"></p></aside>
<label><span data-i18n="setupCode"></span><input id="setup-code" type="password" required autocomplete="off" maxlength="128" aria-describedby="setup-code-help"></label><small class="field-help" id="setup-code-help" data-i18n="helpCode"></small>
<label><span data-i18n="workspace"></span><input id="setup-workspace" required maxlength="128" autocomplete="organization" aria-describedby="setup-workspace-help"></label><small class="field-help" id="setup-workspace-help" data-i18n="helpWorkspace"></small>
<label><span data-i18n="setupName"></span><input id="setup-name" required maxlength="48" autocomplete="name" aria-describedby="setup-name-help"></label><small class="field-help" id="setup-name-help" data-i18n="helpDisplay"></small>
<label><span data-i18n="username"></span><input id="setup-username" required maxlength="32" pattern="[a-z][a-z0-9-]{0,31}" autocomplete="username" aria-describedby="setup-username-help"></label><small class="field-help" id="setup-username-help" data-i18n="helpUsername"></small>
<label><span data-i18n="password"></span><input id="setup-password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password" aria-describedby="setup-password-help"></label><small class="field-help" id="setup-password-help" data-i18n="helpPassword"></small>
<label><span data-i18n="setupConfirmation"></span><input id="setup-confirmation" type="password" required minlength="12" maxlength="1024" autocomplete="new-password" aria-describedby="setup-confirmation-help"></label><small class="field-help" id="setup-confirmation-help" data-i18n="helpConfirmation"></small>
<button type="submit" data-i18n="setupSubmit"></button></form><form id="login"><h2 data-i18n="login">관리자 로그인</h2><label><span data-i18n="workspace">Workspace</span><input id="workspace" required autocomplete="organization" maxlength="128"></label><label><span data-i18n="username">사용자 이름</span><input id="username" required autocomplete="username" maxlength="32"></label><label><span data-i18n="password">비밀번호</span><input id="password" type="password" required autocomplete="current-password"></label><button data-i18n="login" type="submit">로그인</button></form>
<section id="dashboard" class="workspace" hidden>
<aside class="sidebar"><p class="eyebrow" data-i18n="workspace"></p><strong id="actor"></strong><nav aria-label="Workspace"><button id="nav-rooms" type="button" data-i18n="rooms"></button><button id="nav-agents" type="button" data-i18n="agentDirectory"></button></nav><div class="sidebar-bottom"><p data-i18n="prototypeScope"></p><button id="refresh" type="button" data-i18n="refresh"></button><button id="logout" type="button" data-i18n="logout"></button></div></aside>
<div class="workspace-main"><section id="room-browser"><div class="page-heading"><div><p class="eyebrow" data-i18n="privateWorkspace"></p><h1 data-i18n="roomsTitle"></h1><p data-i18n="roomsIntro"></p></div><span class="scope-badge" data-i18n="textOnly"></span></div>
<form id="create" class="create-card"><h2 data-i18n="prepareRoom"></h2><label><span data-i18n="topic"></span><input id="topic" required maxlength="2000"></label><label><span data-i18n="mode"></span><select id="mode"><option value="bounded_rounds" data-i18n="bounded_rounds"></option><option value="free_discussion" data-i18n="free_discussion"></option><option value="co_creation" data-i18n="co_creation"></option></select></label><p class="field-help" data-i18n="prepareHelp"></p><button type="submit" data-i18n="create"></button></form>
<div id="rooms" class="room-grid"></div><section class="handovers-panel"><h2 data-i18n="handovers"></h2><div id="handovers"></div></section></section>
<section id="agent-registry" hidden><div class="page-heading"><div><p class="eyebrow" data-i18n="workspace"></p><h1 data-i18n="agentDirectory"></h1><p data-i18n="agentDirectoryHelp"></p></div></div><form id="register-agent" class="create-card"><h2 data-i18n="registerAgent"></h2><label><span data-i18n="setupName"></span><input id="agent-name" required maxlength="48" autocomplete="off"></label><label><span data-i18n="agentHandle"></span><input id="agent-handle" aria-describedby="agent-handle-help" required maxlength="32" pattern="[a-z][a-z0-9-]{0,31}" autocomplete="off"></label><p id="agent-handle-help" class="field-help" data-i18n="registerHelp"></p><button type="submit" data-i18n="registerAgent"></button></form><section id="connection-wizard" class="connection-wizard" hidden aria-labelledby="connection-title">
<div class="page-heading"><div><p class="eyebrow" data-i18n="connectionJourney"></p><h2 id="connection-title" data-i18n="connectAgent"></h2><p id="connection-identity"></p></div><button id="connection-close" type="button" data-i18n="closeView"></button></div>
<ol class="connection-steps">
<li><h3 data-i18n="chooseRuntime"></h3><label><span data-i18n="runtimeLabel"></span><select id="connection-runtime"><option value="codex">Codex CLI</option><option value="claude">Claude Code CLI</option><option value="grok">Grok CLI</option></select></label><label><span data-i18n="authModeLabel"></span><select id="connection-auth-mode"><option value="native" data-i18n="nativeAuth"></option><option value="api_key" data-i18n="apiKeyAuth"></option></select></label><label id="connection-api-consent-label" class="check-label" hidden><input id="connection-api-consent" type="checkbox"><span data-i18n="apiBillingConsent"></span></label><p class="field-help" data-i18n="nativeAuthHelp"></p><p id="connection-auth-warning" class="scope-note" role="status"></p><p class="field-help" data-i18n="runtimePrerequisite"></p><p class="scope-note" data-i18n="runtimePlatformHelp"></p></li>
<li><h3 data-i18n="authorizeCredential"></h3><p data-i18n="workspaceCredentialHelp"></p><button id="connection-issue" type="button" data-i18n="issueWorkspaceCredential"></button><p id="connection-credential-access" class="field-help"></p><button id="connection-credentials" type="button" data-i18n="manageCredentials"></button><div id="connection-credential-list"></div></li>
<li><h3 data-i18n="saveConnection"></h3><p data-i18n="saveConnectionHelp"></p><label><span data-i18n="connectionConfig"></span><textarea id="connection-config" readonly rows="7"></textarea></label><div class="toolbar"><button id="connection-copy" type="button" data-i18n="copyConfig"></button><button id="connection-download" type="button" data-i18n="downloadConfig"></button></div><p data-i18n="runConnectionHelp"></p><pre id="connection-command"></pre><p class="field-help" data-i18n="resumeWorkerHelp"></p><p class="scope-note" data-i18n="connectionLimits"></p></li>
<li><h3 data-i18n="checkRuntimeReceipt"></h3><div id="connection-evidence" aria-live="polite"></div><p class="field-help" data-i18n="receiptHelp"></p><button id="connection-refresh" type="button" data-i18n="refreshReceipt"></button></li>
<li><h3 data-i18n="inviteAfterConnection"></h3><p data-i18n="connectionInviteHelp"></p><button id="connection-rooms" type="button" data-i18n="goInvite"></button></li>
</ol></section><div id="agents-list" class="room-grid"></div></section>
<section id="detail" hidden><button id="close" type="button" class="back-button" data-i18n="backRooms"></button><div class="page-heading"><div><p class="eyebrow" data-i18n="privateRoom"></p><h1 id="room-title"></h1><p id="room-state"></p></div><span class="scope-badge" data-i18n="textOnly"></span></div><div id="workflow" class="workflow-card" role="status"></div>
<nav id="room-tabs" class="room-tabs" role="tablist" aria-label="Room views"><button id="tab-control-discussion" role="tab" aria-controls="tab-discussion" aria-selected="true" tabindex="0" type="button" data-tab="discussion" data-i18n="discussion"></button><button id="tab-control-participants" role="tab" aria-controls="tab-participants" aria-selected="false" tabindex="-1" type="button" data-tab="participants" data-i18n="participants"></button><button id="tab-control-artifacts" role="tab" aria-controls="tab-artifacts" aria-selected="false" tabindex="-1" type="button" data-tab="artifacts" data-i18n="artifacts"></button><button id="tab-control-management" role="tab" aria-controls="tab-management" aria-selected="false" tabindex="-1" type="button" data-tab="management" data-i18n="management"></button></nav>
<section role="tabpanel" aria-labelledby="tab-control-discussion" id="tab-discussion" class="room-panel"><h2 data-i18n="discussion"></h2><div id="messages" class="timeline"></div><form id="message"><label><span data-i18n="kind"></span><select id="message-kind"><option value="question" data-i18n="question"></option><option value="advice" data-i18n="advice"></option></select></label><label><span data-i18n="text"></span><textarea id="message-text" required maxlength="16000"></textarea></label><p class="field-help" data-i18n="humanMessageHelp"></p><button type="submit" data-i18n="send"></button></form><h3 data-i18n="tasks"></h3><ul id="tasks" class="task-list"></ul></section>
<section role="tabpanel" aria-labelledby="tab-control-participants" id="tab-participants" class="room-panel" hidden><h2 data-i18n="participants"></h2><form id="invite-agent" class="create-card"><label><span data-i18n="inviteAgent"></span><select id="invite-agent-id" required></select></label><p class="field-help" data-i18n="inviteHelp"></p><button type="submit" data-i18n="inviteAgent"></button><button id="go-register" type="button" data-i18n="registerAgent"></button></form><ul id="members" class="member-grid"></ul><p class="field-help" data-i18n="evidenceHelp"></p></section>
<section role="tabpanel" aria-labelledby="tab-control-artifacts" id="tab-artifacts" class="room-panel" hidden><h2 data-i18n="artifacts"></h2><p data-i18n="artifactHelp"></p><div id="artifacts"></div><p class="scope-note" data-i18n="binaryUnavailable"></p></section>
<section role="tabpanel" aria-labelledby="tab-control-management" id="tab-management" class="room-panel" hidden><h2 data-i18n="management"></h2><div class="toolbar" id="controls"><button data-action="start" data-i18n="startDiscussion"></button><button data-action="pause" data-i18n="pause"></button><button data-action="resume" data-i18n="resume"></button><button data-action="close" data-i18n="closeRoom"></button></div><p class="field-help" data-i18n="controlHelp"></p><section id="intervention-panel" hidden><h3 data-i18n="interventions"></h3><div id="interventions"></div></section></section>
</section></div></section>
<dialog id="onboarding-dialog" aria-labelledby="onboarding-title" aria-describedby="onboarding-help"><button id="onboarding-close" type="button" data-i18n="closeView"></button><h2 id="onboarding-title" data-i18n="onboardingTitle"></h2><p id="onboarding-help" data-i18n="onboardingHelp"></p><label><span data-i18n="participantPrompt"></span><textarea id="onboarding-prompt" readonly rows="9"></textarea></label><button id="copy-prompt" type="button" data-i18n="copyPrompt"></button><label><span data-i18n="connectionConfig"></span><textarea id="onboarding-config" readonly rows="7"></textarea></label><button id="copy-config" type="button" data-i18n="copyConfig"></button><h3 data-i18n="workerSteps"></h3><pre id="onboarding-commands"></pre><p class="scope-note" data-i18n="runtimeNotRun"></p><p class="scope-note" data-i18n="runtimePlatformHelp"></p></dialog>
<dialog id="credential-dialog" aria-labelledby="credential-title" aria-describedby="credential-help"><button id="credential-close" type="button" data-i18n="closeView"></button><h2 id="credential-title" data-i18n="credentialTitle"></h2><p id="credential-help" data-i18n="credentialPrivate"></p><label><span data-i18n="credentialLabel"></span><input id="credential-value" type="password" readonly autocomplete="off"></label><button id="credential-reveal" type="button" data-i18n="revealCredential"></button><p id="credential-expiry"></p><p class="field-help" data-i18n="credentialClearHelp"></p></dialog>
</main><footer><span>TalkAbout</span><span data-i18n="prototypeScope"></span></footer></body></html>
