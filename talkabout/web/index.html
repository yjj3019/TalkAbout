<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalkAbout</title><link rel="stylesheet" href="/web/style.css"><script type="module" src="/web/app.mjs"></script></head>
<body><header><h1>TalkAbout</h1><span data-i18n="prototype">비공개 text-only prototype</span><button id="language" type="button">EN</button></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<form id="login"><h2 data-i18n="login">관리자 로그인</h2><label><span data-i18n="workspace">Workspace</span><input id="workspace" required autocomplete="organization" maxlength="128"></label><label><span data-i18n="username">사용자 이름</span><input id="username" required autocomplete="username" maxlength="32"></label><label><span data-i18n="password">비밀번호</span><input id="password" type="password" required autocomplete="current-password"></label><button data-i18n="login" type="submit">로그인</button></form>
<section id="dashboard" hidden><div class="toolbar"><strong id="actor"></strong><button id="refresh" data-i18n="refresh">새로고침</button><button id="logout" data-i18n="logout">로그아웃</button></div><form id="create"><label><span data-i18n="topic">주제</span><input id="topic" required maxlength="2000"></label><label><span data-i18n="mode"></span><select id="mode"><option value="bounded_rounds" data-i18n="bounded_rounds"></option><option value="free_discussion" data-i18n="free_discussion"></option><option value="co_creation" data-i18n="co_creation"></option></select></label><button type="submit" data-i18n="create">방 만들기</button></form><h2 data-i18n="rooms">방 목록</h2><div id="rooms"></div><h2 data-i18n="handovers"></h2><div id="handovers"></div><p data-i18n="unsupportedUi"></p></section>
<section id="detail" hidden><button id="close" data-i18n="closeView">보기 닫기</button><h2 id="room-title"></h2><p id="room-state"></p><h3 data-i18n="participants">참여자</h3><ul id="members"></ul><div class="toolbar" id="controls"><button data-action="pause" data-i18n="pause">일시정지</button><button data-action="resume" data-i18n="resume">재개</button><button data-action="close" data-i18n="closeRoom">방 종료</button></div><h3 data-i18n="discussion">대화</h3><div id="messages"></div><form id="message"><label><span data-i18n="kind">메시지 종류</span><select id="message-kind"><option value="question" data-i18n="question">질문</option><option value="advice" data-i18n="advice">조언</option></select></label><label><span data-i18n="text">내용</span><textarea id="message-text" required maxlength="16000"></textarea></label><button type="submit" data-i18n="send">보내기</button></form><h3 data-i18n="artifacts">텍스트 산출물</h3><div id="artifacts"></div><h3 data-i18n="tasks">에이전트 작업 상태</h3><ul id="tasks"></ul></section>
<section id="intervention-panel" hidden><h3 data-i18n="interventions">관리자 개입 이력</h3><div id="interventions"></div></section>
</main></body></html>
